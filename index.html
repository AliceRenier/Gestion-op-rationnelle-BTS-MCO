<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabinet ORIENS — vos missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Page volontairement autonome : aucun fichier externe.
   Elle doit s'afficher correctement même ouverte toute seule. */
:root{
  --nuit:#0B1425; --vitrine:#131F36; --vitrine-2:#1B2C49; --trait:#26395C;
  --neon:#FF3D8E; --neon-doux:#FF7FB5; --ambre:#FFC24A; --menthe:#3FD9A4;
  --gris:#8FA3C4; --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--nuit);color:#EAF0FA;min-height:100vh;
  font-family:'Karla',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%,rgba(255,61,142,.16),transparent 60%),
             radial-gradient(90% 60% at 85% 110%,rgba(255,194,74,.10),transparent 60%);
}
h1,h2,h3{font-family:'Bricolage Grotesque','Karla',sans-serif;font-weight:700;line-height:1.08;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}

.hub{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:46px 16px 96px}
.eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.eyebrow .puce{width:7px;height:7px;border-radius:99px;background:var(--menthe);box-shadow:0 0 10px var(--menthe)}
.eyebrow span{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--menthe)}
.hub-tete{margin-bottom:40px}
.hub-tete h1{font-size:clamp(32px,8vw,52px);margin-bottom:14px}
.enseigne{
  color:#fff;text-transform:uppercase;
  text-shadow:0 0 6px var(--neon),0 0 20px var(--neon),0 0 50px rgba(255,61,142,.7);
  animation:allumage 2.4s ease-out both;
}
@keyframes allumage{
  0%,14%{opacity:.15;text-shadow:none} 16%,20%{opacity:1}
  22%{opacity:.2;text-shadow:none}
  26%,100%{opacity:1;text-shadow:0 0 6px var(--neon),0 0 20px var(--neon),0 0 50px rgba(255,61,142,.7)}
}
.hub-tete p{color:var(--gris);font-size:16.5px;max-width:54ch}

.groupe{margin-top:40px}
.groupe-tete{display:flex;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--trait);margin-bottom:8px}
.groupe-tete h2{font-size:19px}
.groupe-tete .n{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gris);margin-left:auto}
.intro{color:var(--gris);font-size:14.5px;margin-bottom:18px;max-width:60ch}

.grille{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.m-carte{
  background:var(--vitrine);border:1px solid var(--trait);border-radius:10px;padding:18px;
  display:flex;flex-direction:column;transition:border-color .18s,transform .18s;
}
.m-carte:not(.bientot):hover{border-color:var(--neon-doux);transform:translateY(-2px)}
.m-carte.bientot{opacity:.45;border-style:dashed}
.m-haut{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.m-ref{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--gris)}
.m-etat{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;
  padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.m-etat.ok{color:var(--menthe)}
.m-etat.wip{color:var(--gris)}
.m-carte h3{font-size:19px;margin-bottom:6px}
.sujet{font-size:14.5px;color:var(--gris);margin-bottom:14px}
.m-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.m-meta span{font-size:11.5px;color:var(--gris);border:1px solid var(--trait);border-radius:99px;padding:2px 10px}
.m-meta span.niv{color:var(--ambre);border-color:rgba(255,194,74,.45)}
.m-actions{display:flex;gap:8px;margin-top:auto}
.m-jouer{
  flex:1;text-align:center;background:var(--neon);color:#fff;text-decoration:none;
  font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:14.5px;
  padding:12px;border-radius:var(--r);transition:filter .15s;
  box-shadow:0 6px 22px -8px rgba(255,61,142,.75);
}
.m-jouer:hover{filter:brightness(1.12)}
.m-lien{flex:none;border:1px solid var(--trait);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--gris);transition:.15s}
.m-lien:hover{border-color:var(--neon);color:#fff}
.m-lien.fait{color:var(--menthe);border-color:var(--menthe)}

.note{margin-top:48px;border:1px dashed var(--trait);border-radius:10px;padding:18px;font-size:14.5px;color:var(--gris)}
.note b{color:#EAF0FA}
.note code{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ambre);
  background:rgba(255,194,74,.1);padding:1px 6px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="hub">
  <div class="hub-tete">
    <div class="eyebrow"><span class="puce"></span><span>Cabinet ORIENS · BTS MCO</span></div>
    <h1>Vos <span class="enseigne">missions</span></h1>
    <p>Chaque dossier est une entreprise en difficulté. À vous de trouver ce qui cloche. Rien à installer, aucun compte à créer : ouvrez et jouez.</p>
  </div>
  <div id="catalogue"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   LE CATALOGUE — la seule chose à modifier pour ajouter une mission :
   ajoutez son identifiant (nom du fichier dans missions/, sans le .js)
   dans la liste "prets" du bon groupe. Titre, sujet, niveau et durée
   sont lus automatiquement depuis window.MISSION du fichier lui-même
   (champs enseigne / accroche / niveau / duree / chapitres) —
   rien à recopier ici. "aVenir" reste pour les cases pas encore écrites.
   ════════════════════════════════════════════════════════════ */
const GROUPES = [
  { groupe:"Chapitre 0 — Calculs de base",
    intro:"Le socle : pourcentages, remises, HT/TTC, marges. À faire avant tout le reste.",
    prets:["go-00", "c0-moyen"],
    aVenir:[
      {ref:"C0-D", titre:"À venir", niveau:"Difficile", sujet:"Une seule question de départ, comme à l'examen — sur ce chapitre uniquement.", meta:[]}
    ]},
  { groupe:"Analyse financière & Marges",
    intro:"Bilan fonctionnel, trésorerie, taux de marge. La difficulté monte d'une mission à l'autre.",
    prets:["go-01", "go-02"],
    aVenir:[
      {ref:"AF-D", titre:"À venir", niveau:"Difficile", sujet:"Une seule question de départ, comme à l'examen — sur ce chapitre uniquement.", meta:[]}
    ]},
  { groupe:"Prochains chapitres",
    intro:"Pas encore écrits — la trame de l'année à venir.",
    prets:[],
    aVenir:[
      {ref:"GO-03", titre:"À venir", sujet:"Coûts, charges fixes et seuil de rentabilité.", meta:["Gestion des coûts"]},
      {ref:"GO-04", titre:"À venir", sujet:"Gestion des stocks et approvisionnements.", meta:["Approvisionnement"]}
    ]},
  { groupe:"Entraînement à l'examen",
    intro:"Les chapitres sont mélangés, il n'y a ni plan ni indice de départ. Une seule question au départ, comme à l'épreuve E5.",
    prets:[],
    aVenir:[
      {ref:"E5-01", titre:"À venir", niveau:"Difficile", sujet:"Dossier complet, plusieurs chapitres croisés, recommandation à rédiger.", meta:["Mixte","Sans guidage"]}
    ]}
];

const base = location.href.replace(/index\.html.*$/, "").replace(/\?.*$/, "");

/* Charge une mission juste pour lire ses métadonnées (pas le moteur).
   Un identifiant introuvable ne casse pas la page : la carte est
   simplement ignorée, avec un avertissement en console. */
function chargerMission(id){
  return new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "missions/" + id + ".js";
    s.onload = () => { const m = window.MISSION; window.MISSION = undefined; resolve(m); };
    s.onerror = () => { console.warn("Mission introuvable :", id); resolve(null); };
    document.head.appendChild(s);
  });
}

async function carteDepuisMission(id){
  const m = await chargerMission(id);
  if(!m) return null;
  return {
    id, ref:m.ref, titre:m.enseigne, niveau:m.niveau || "",
    sujet:m.accroche || m.sujet || "", meta:[...(m.chapitres || []), m.duree].filter(Boolean),
    pret:true
  };
}

async function construire(){
  for(const g of GROUPES){
    const cartes = [];
    for(const id of g.prets){
      const c = await carteDepuisMission(id);
      if(c) cartes.push(c);
    }
    g.aVenir.forEach(a => cartes.push(Object.assign({pret:false, meta:a.meta || []}, a)));
    g.cartes = cartes;
  }
  afficher();
}

function afficher(){
  document.getElementById("catalogue").innerHTML = GROUPES.map(g => `
    <div class="groupe">
      <div class="groupe-tete"><h2>${g.groupe}</h2>
        <span class="n">${g.cartes.filter(i => i.pret).length} / ${g.cartes.length} disponibles</span></div>
      <p class="intro">${g.intro}</p>
      <div class="grille">${g.cartes.map(m => `
        <div class="m-carte${m.pret ? "" : " bientot"}">
          <div class="m-haut"><span class="m-ref">${m.ref}</span>
            <span class="m-etat ${m.pret ? "ok" : "wip"}">${m.pret ? "disponible" : "en préparation"}</span></div>
          <h3>${m.titre}</h3>
          <p class="sujet">${m.sujet}</p>
          <div class="m-meta">${m.niveau ? `<span class="niv">${m.niveau}</span>` : ""}${m.meta.map(t => `<span>${t}</span>`).join("")}</div>
          ${m.pret ? `<div class="m-actions">
            <a class="m-jouer" href="jouer.html?m=${m.id}">Ouvrir le dossier</a>
            <button class="m-lien" data-id="${m.id}" title="Copier le lien à coller dans Classroom">Lien</button>
          </div>` : ""}
        </div>`).join("")}</div>
    </div>`).join("");
  brancherLiens();
}

function brancherLiens(){
document.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", async () => {
  const url = base + "jouer.html?m=" + b.dataset.id;
  try { await navigator.clipboard.writeText(url); }
  catch(e){ prompt("Copiez ce lien :", url); return; }
  b.textContent = "Copié"; b.classList.add("fait");
  setTimeout(() => { b.textContent = "Lien"; b.classList.remove("fait"); }, 1800);
}));
}

construire();
</script>
</body>
</html>
